<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STUDIO27</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white text-black">

  <!-- Header: logo, nav, cart (stacks on phone, row on tablet and up) -->
  <header class="border-b border-gray-300">
    <div class="flex flex-col items-center gap-3 p-4 md:flex-row md:justify-between md:px-8">
      <nav class="flex gap-6 text-sm">
        <a href="index.html">New</a>
        <a href="index.html">Men</a>
        <a href="index.html">Women</a>
        <a href="index.html">Sale</a>
      </nav>
      <h1 class="text-2xl font-bold tracking-widest">STUDIO27</h1>
      <a href="#" class="text-sm">Cart (0)</a>
    </div>
  </header>

  <!-- Product grid: 2 columns phone, 3 tablet, 4 desktop -->
  <main class="p-4 md:p-8">
    <h2 class="text-xl font-semibold mb-4">New Arrivals</h2>
    <div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4">

      <div>
        <img src="images/product-1.svg" alt="Box Logo Tee" class="w-full">
        <h3 class="mt-2 font-medium">Box Logo Tee</h3>
        <p class="text-gray-500">$48</p>
        <button class="mt-2 w-full border border-black py-2 hover:bg-black hover:text-white">Add to Cart</button>
      </div>

      <div>
        <img src="images/product-2.svg" alt="Heavyweight Hoodie" class="w-full">
        <h3 class="mt-2 font-medium">Heavyweight Hoodie</h3>
        <p class="text-gray-500">$165</p>
        <button class="mt-2 w-full border border-black py-2 hover:bg-black hover:text-white">Add to Cart</button>
      </div>

      <div>
        <img src="images/product-3.svg" alt="Waffle Crewneck" class="w-full">
        <h3 class="mt-2 font-medium">Waffle Crewneck</h3>
        <p class="text-gray-500">$140</p>
        <button class="mt-2 w-full border border-black py-2 hover:bg-black hover:text-white">Add to Cart</button>
      </div>

      <div>
        <img src="images/product-4.svg" alt="Washed Twill Cap" class="w-full">
        <h3 class="mt-2 font-medium">Washed Twill Cap</h3>
        <p class="text-gray-500">$55</p>
        <button class="mt-2 w-full border border-black py-2 hover:bg-black hover:text-white">Add to Cart</button>
      </div>

      <div>
        <img src="images/product-5.svg" alt="Nylon Track Shorts" class="w-full">
        <h3 class="mt-2 font-medium">Nylon Track Shorts</h3>
        <p class="text-gray-500">$98</p>
        <button class="mt-2 w-full border border-black py-2 hover:bg-black hover:text-white">Add to Cart</button>
      </div>

      <div>
        <img src="images/product-6.svg" alt="Canvas Tote" class="w-full">
        <h3 class="mt-2 font-medium">Canvas Tote</h3>
        <p class="text-gray-500">$38</p>
        <button class="mt-2 w-full border border-black py-2 hover:bg-black hover:text-white">Add to Cart</button>
      </div>

      <div>
        <img src="images/product-7.svg" alt="Pocket Tee" class="w-full">
        <h3 class="mt-2 font-medium">Pocket Tee</h3>
        <p class="text-gray-500">$52</p>
        <button class="mt-2 w-full border border-black py-2 hover:bg-black hover:text-white">Add to Cart</button>
      </div>

      <div>
        <img src="images/product-8.svg" alt="Quilted Vest" class="w-full">
        <h3 class="mt-2 font-medium">Quilted Vest</h3>
        <p class="text-gray-500">$225</p>
        <button class="mt-2 w-full border border-black py-2 hover:bg-black hover:text-white">Add to Cart</button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-300 mt-10 p-6 text-center text-sm text-gray-500">
    <div class="flex justify-center gap-6 mb-2">
      <a href="#">Shipping</a>
      <a href="#">Returns</a>
      <a href="#">Contact</a>
    </div>
    <p>&copy; 2026 STUDIO27</p>
  </footer>

</body>
</html>
